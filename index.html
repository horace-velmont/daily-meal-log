<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하루 식탁 · Daily Meal Log</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="./" class="brand">◒ 하루 식탁 <small>DAILY MEAL LOG</small></a><span>horace-velmont</span></header><main><div class="intro"><span class="eyebrow">A LITTLE RECORD, EVERY DAY</span><h1>오늘도, 잘 먹었습니다.</h1><p>하루의 식사를 기록하고 나만의 식습관을 살펴보세요.</p></div><section class="datebar" aria-label="날짜별 페이지 이동"><button id="prev" aria-label="이전 날짜">←</button><div><input type="date" id="date" aria-label="기록 날짜"><div id="weekday"></div></div><button id="next" aria-label="다음 날짜">→</button><button id="today">오늘</button></section><section class="summary"><div><span>하루 총섭취량</span><h2><b id="total">0</b> <small>kcal</small></h2><p id="goalStatus"></p></div><div class="goal"><label for="goal">일일 목표 <input type="number" id="goal" min="1" max="100000" step="1"> kcal</label><progress id="progress" max="2000" value="0"></progress><small>목표는 내 상황에 맞게 자유롭게 설정하세요.</small></div></section><div class="section-title"><h2>오늘의 식단</h2><span id="count"></span></div><div id="meals"></div><section class="notes"><label for="note">하루 메모</label><textarea id="note" rows="3" placeholder="오늘의 식사에 대해 남기고 싶은 이야기" maxlength="5000"></textarea></section><footer><p>기록은 현재 브라우저에 저장됩니다. 기기를 옮기기 전 백업해 주세요.</p><div><button id="export">기록 내보내기 ↓</button><button id="import">백업 가져오기 ↑</button><input type="file" accept="application/json,.json" id="file" hidden></div></footer><p id="status" role="status" aria-live="polite"></p></main><dialog id="editor"><form id="form"><div class="section-title"><h2 id="formTitle">음식 추가</h2><button type="button" id="close" aria-label="닫기">×</button></div><label>음식 이름<input id="food" required maxlength="100" placeholder="예: 현미밥과 닭가슴살"></label><label>섭취 칼로리 (kcal)<input id="calories" type="number" min="0" max="100000" step="1" required placeholder="450"></label><p class="hint">섭취한 양에 해당하는 칼로리를 입력하세요.</p><button type="submit" class="primary">기록 저장</button></form></dialog><script type="module" src="app.js"></script></body></html>
